<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="newtask">
            <input id= "input" type="text" placeholder="Task to be done..."/>
            <button id ="btn" class="btn">Add</button>
        </div>
        <div id="tasks">
            <div class="task">Hello
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-QKVvbdnaMFeI3bOMeSt962_oAMIOteeFkQ&s" alt="">
            </div>
        </div>
    </div>
    <script>
        const addBtn = document.getElementById("btn");
        addBtn.addEventListener("click", ()=>{
            const tasks = document.getElementById("tasks");
            const input = document.getElementById("input");
            const taskText = input.value.trim();

            if (taskText !== ""){
            const task = document.createElement("div");
            task.classList.add("task");
            const image = document.createElement("img");
            image.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-QKVvbdnaMFeI3bOMeSt962_oAMIOteeFkQ&s";
            task.textContent = taskText;
            tasks.appendChild(task);
            task.appendChild(image);
            input.value = "";
            }
        });
    </script>
</body>
</html>
